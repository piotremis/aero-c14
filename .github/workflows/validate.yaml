name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
